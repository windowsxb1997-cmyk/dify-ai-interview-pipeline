    - data:
        code: |
          import json, re
          from datetime import datetime, timedelta, timezone

          def extract_json_block(text: str) -> str:
              blocks = re.findall(r'```json\s*(\{.*?\})\s*```', text, re.S)
              if blocks:
                  return blocks[-1]
              i, j = text.find('{'), text.rfind('}')
              if i != -1 and j > i:
                  return text[i:j + 1]
              return '{}'

          def main(profile_text: str, sentiment_text: str, signals_text: str,
                   top_words: str, interviewee: str) -> dict:
              profile_json = extract_json_block(profile_text)
              signals_json = extract_json_block(signals_text)
              user_type, opportunity, pain = '', '', ''
              try:
                  s = json.loads(signals_json)
                  user_type = str(s.get('user_type', ''))
                  opportunity = str(s.get('opportunity_judgment', ''))
                  pain = str(s.get('pain_severity', ''))
              except Exception:
                  pass
              now = (datetime.now(timezone.utc) + timedelta(hours=8)).strftime('%Y-%m-%d %H:%M:%S')
              report = profile_text + '\n\n---\n\n' + sentiment_text + '\n\n---\n\n' + signals_text
              fields = {
                  '受访者编号': interviewee,
                  '用户类型': user_type,
                  '机会判断': opportunity,
                  '痛点强度': pain,
                  '高频词': top_words,
                  '画像JSON': profile_json,
                  '信号JSON': signals_json,
                  '分析报告全文': report,
                  '分析时间': now,
              }
              return {
                  'payload': json.dumps({'fields': fields}, ensure_ascii=False),
                  'user_type': user_type,
                  'opportunity': opportunity,
              }
        code_language: python3
        desc: 提取三个LLM输出中的JSON块，组装写入「访谈分析库」的记录
        outputs:
          opportunity:
            children: null
            type: string
          payload:
            children: null
            type: string
          user_type:
            children: null
            type: string
        selected: false
        title: 打包分析结果
        type: code
        variables:
        - value_selector:
          - llm_profile
          - text
          variable: profile_text
        - value_selector:
          - llm_sentiment
          - text
          variable: sentiment_text
        - value_selector:
          - llm_signals
          - text
          variable: signals_text
        - value_selector:
          - code_freq
          - top_words
          variable: top_words
        - value_selector:
          - start
          - interviewee_name
          variable: interviewee
