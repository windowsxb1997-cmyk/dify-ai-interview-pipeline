    - data:
        code: |
          import re
          from collections import Counter

          STOPWORDS = set("""a an the and or but if then else when while at by for with without about into through during before after above below to from up down in out on off over under again further once here there all any both each few more most other some such no nor not only own same so than too very can will just don should now i me my mine myself we our ours ourselves you your yours yourself yourselves he him his himself she her hers herself it its itself they them their theirs themselves this that these those am is are was were be been being have has had having do does did doing would could ought im youre hes shes its weve theyre ive youve weve ill youll hell shell well theyll id youd hed shed wed theyd isnt arent wasnt werent hasnt havent hadnt doesnt dont didnt wont wouldnt shant shouldnt mustnt cant cannot uh um umm hmm mhm yeah yep yup nope okay ok alright well oh ah wow hey hi hello thank thanks please mr ms mrs sir yeah like know think thought really actually basically literally get got gets getting go goes going went want wants wanted need needs needed make makes made take takes took see saw seen look looks looking thing things stuff lot lots kinda sorta maybe probably sure course guess feel feels felt feeling say says said saying tell tells told talking talk talked ask asked answer answered right exactly totally definitely honestly interview interviewer interviewee question questions answer answers let lets us something anything everything someone anyone everybody somebody nobody one two three also even still much many every put way back""".split())

          def main(text: str) -> dict:
              words = re.findall(r"[a-zA-Z][a-zA-Z'-]{2,}", text.lower())
              words = [w.strip("'-") for w in words]
              words = [w for w in words if w and w not in STOPWORDS]
              counter = Counter(words)
              top = counter.most_common(30)
              lines = ["{}. {} —— {} 次".format(i + 1, w, c) for i, (w, c) in enumerate(top)]
              return {
                  "top_words": "\n".join(lines) if lines else "（未统计到有效词汇）",
                  "total_words": len(words),
                  "unique_words": len(counter)
              }
        code_language: python3
        desc: 统计英文文字稿高频词（自动过滤停用词与访谈口头禅）
        variables:
        - value_selector:
          - doc_extract
          - text
          variable: text
        outputs:
          top_words:
            children: null
            type: string
          total_words:
            children: null
            type: number
          unique_words:
            children: null
            type: number
        selected: false
        title: 高频词统计
        type: code
      height: 90
      id: code_freq
      position:
        x: 660
        y: 60
      positionAbsolute:
        x: 660
        y: 60
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
